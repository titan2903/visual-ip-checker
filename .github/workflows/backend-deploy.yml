name: Deploy Backend to Heroku

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Procfile"
      - "runtime.txt"
      - "requirements.txt"
      - ".slugignore"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -p no:launch_testing backend/tests -v

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          cat << EOF > ~/.netrc
          machine api.heroku.com
            login ${HEROKU_EMAIL:-_}
            password $HEROKU_API_KEY
          machine git.heroku.com
            login ${HEROKU_EMAIL:-_}
            password $HEROKU_API_KEY
          EOF
          chmod 600 ~/.netrc
          git remote add heroku https://git.heroku.com/$HEROKU_APP_NAME.git || git remote set-url heroku https://git.heroku.com/$HEROKU_APP_NAME.git
          git push -f heroku HEAD:main

